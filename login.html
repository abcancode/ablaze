<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Ablaze Impact Foundation</title>
    <link rel="stylesheet" href="/assets/styles/login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;700&family=Sentient:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="login-section">
      <!-- Left Container -->
      <div class="login-left animate-bg">
        <div class="overlay"></div>
        <img
          src="/assets/images/ablaze-logo.png"
          alt="Ablaze Impact Foundation Logo"
          class="logo fade-in"
        />
        <div class="text-box fade-up">
          <h2>Login to Continue</h2>
          <p>Login to your account to continue application</p>
        </div>
      </div>

      <!-- Right Container -->
      <div class="login-right fade-in">
        <form class="login-form fade-up">
          <h3>Log In!</h3>
          <input type="email" placeholder="Email Address" required />
          <input type="password" placeholder="Enter Password" required />
          <a href="#" class="forgot-password">Forgot Password?</a>
          <button class="login-btn" type="submit">Login</button>
          <p class="login-text">
            Don’t have an account? <a href="register.html">Sign up</a>
          </p>
          <div class="divider">Or Login With</div>

          <div class="social-login">
            <button class="social-btn google">
              <img src="/assets/images/google-icon.png" alt="Google" /> Google
            </button>
            <button class="social-btn facebook">
              <img src="/assets/images/twitter-icon.png" alt="Twitter" />
              Twitter
            </button>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
