    <section class="scholarship-section">
      <h2>Application for Ablaze Foundation Scholarship Program</h2>

      <div class="form-container">
        <h3>Application Form</h3>

        <form class="scholarship-form" id="scholarshipForm">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              placeholder="Enter your phone number"
              required
            />
          </div>

          <div class="form-group">
            <label for="location">Location</label>
            <select id="location" required>
              <option value="">Select your location</option>
              <option value="lagos">Lagos</option>
              <option value="abuja">Abuja</option>
              <option value="enugu">Enugu</option>
              <option value="portharcourt">Port Harcourt</option>
              <option value="others">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="university">Name of the University</label>
            <input
              type="text"
              id="university"
              placeholder="Enter your university name"
              required
            />
          </div>

          <!-- Drag & Drop Upload -->
          <div class="form-group file-upload">
            <label>Upload File</label>
            <div class="upload-box" id="uploadBox">
              <p id="uploadText">
                Drag and Drop here or <span>Browse Files</span>
              </p>
              <input
                type="file"
                id="file"
                accept=".pdf,.jpg,.png,.jpeg"
                hidden
              />
            </div>
          </div>

          <button type="submit" class="submit-btn">Submit Application</button>
        </form>
      </div>
    </section>

    <button id="backToTop" title="Go to top">↑</button>

    <script src="/assets/js/main.js"></script>
  </body>
