<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Ablaze Impact Foundation</title>
    <link rel="stylesheet" href="/assets/styles/register.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;700&family=Sentient:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="signup-section">
      <!-- Left Container -->
      <div class="signup-left animate-bg">
        <div class="overlay"></div>
        <img
          src="/assets/images/ablaze-logo.png"
          alt="Ablaze Impact Foundation Logo"
          class="logo fade-in"
        />
        <div class="text-box fade-up">
          <h2>Register Account</h2>
          <p>Kindly fill in your information to register</p>
        </div>
      </div>

      <!-- Right Container -->
      <div class="signup-right fade-in">
        <form class="signup-form fade-up">
          <h3>Registration</h3>
          <input type="text" placeholder="Full Name" required />
          <input type="text" placeholder="Username" required />
          <input type="email" placeholder="Email Address" required />
          <input type="password" placeholder="Create Password" required />
          <input type="password" placeholder="Confirm Password" required />
          <button type="submit">Create Account</button>
          <p class="login-text">
            Already have an account? <a href="login.html">Log In</a>
          </p>
        </form>
      </div>
    </section>
  </body>
</html>
